<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Tab - Blocky 3D Tornado & Emergency Response</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #070a12;
            font-family: 'Courier New', Courier, monospace;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        #search-container {
            position: absolute;
            padding: 14px 20px;
            background-color: rgba(15, 23, 42, 0.95);
            border: 4px solid #38bdf8;
            box-shadow: 6px 6px 0px #0284c7;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }

        input[type="text"] {
            background-color: #1e293b;
            color: #38bdf8;
            border: 2px solid #38bdf8;
            padding: 10px;
            width: 240px;
            font-size: 15px;
            outline: none;
            font-weight: bold;
        }

        input[type="submit"] {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
        }

        input[type="submit"]:hover {
            background-color: #7dd3fc;
        }

        /* Top-Left Emergency Button Panel */
        #emergency-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 30;
        }

        #emergency-btn {
            background-color: #dc2626;
            color: #ffffff;
            border: 4px solid #7f1d1d;
            box-shadow: 4px 4px 0px #450a0a;
            padding: 12px 18px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.1s ease;
        }

        #emergency-btn:hover {
            background-color: #ef4444;
            transform: scale(1.03);
        }

        #emergency-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #450a0a;
        }

        /* Top-Right Control Panel */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 30;
            background: rgba(15, 23, 42, 0.92);
            border: 3px solid #38bdf8;
            box-shadow: 4px 4px 0px #0284c7;
            color: #f8fafc;
            padding: 14px;
            width: 210px;
            backdrop-filter: blur(6px);
        }

        #control-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #38bdf8;
            text-transform: uppercase;
            border-bottom: 2px solid #334155;
            padding-bottom: 6px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 4px;
            color: #94a3b8;
        }

        .control-group select, .control-group input[type="range"] {
            width: 100%;
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 4px;
            font-family: inherit;
        }

        .value-display {
            font-size: 11px;
            color: #38bdf8;
            float: right;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="tornadoCanvas"></canvas>
    </div>

    <!-- Emergency Button (Top-Left) -->
    <div id="emergency-panel">
        <button id="emergency-btn">🚨 SEND RESCUE TEAM</button>
    </div>

    <!-- Search Container -->
    <div id="search-container">
        <form action="https://www.google.com/search" method="get">
            <input type="text" name="q" placeholder="Search the storm..." autofocus autocomplete="off">
            <input type="submit" value="GO">
        </form>
    </div>

    <!-- Tornado Control Panel (Top-Right) -->
    <div id="control-panel">
        <h3>Storm Controls</h3>
        
        <div class="control-group">
            <label for="ef-scale">EF Rating</label>
            <select id="ef-scale">
                <option value="0">EF0 - Light</option>
                <option value="1">EF1 - Moderate</option>
                <option value="2">EF2 - Considerable</option>
                <option value="3" selected>EF3 - Severe</option>
                <option value="4">EF4 - Devastating</option>
                <option value="5">EF5 - Incredible</option>
            </select>
        </div>

        <div class="control-group">
            <label>Funnel Width <span id="width-val" class="value-display">1.0x</span></label>
            <input type="range" id="funnel-width" min="0.5" max="2.5" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>Suction Force <span id="suction-val" class="value-display">1.0x</span></label>
            <input type="range" id="suction-force" min="0.5" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>Orbit Speed <span id="speed-val" class="value-display">1.0x</span></label>
            <input type="range" id="orbit-speed" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
